on:
  pull_request:
    branches: main

name: checks

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: Check for underscores
        run: |
          chapters <- list.files(path = "moneos_2023/150_geintegreerd_rapport")
          if (any(grepl("^_.*\\.Rmd$", chapters))) {
            stop("Verwijder de underscores voor de hoofdstuknamen!")
          }
        shell: Rscript {0}
